name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Sync dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q

  frontend:
    name: frontend (check + build + artifacts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # The pytest suite skips this oracle when node_modules is absent, so the
      # generated-artifact sync is checked here explicitly.
      - name: Check generated artifacts
        run: node scripts/generate-library-spec.mjs --check

  release-check:
    name: release metadata
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Tag and versions agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pyproject="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          package="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("frontend/package.json").read_text())["version"])')"
          echo "tag=$tag pyproject=$pyproject package.json=$package"
          if [ "$tag" != "$pyproject" ]; then
            echo "::error::tag $tag does not match pyproject.toml version $pyproject"
            exit 1
          fi
          if [ "$pyproject" != "$package" ]; then
            echo "::error::pyproject.toml $pyproject does not match frontend/package.json $package"
            exit 1
          fi

  docs-hygiene:
    name: docs hygiene (no leaking markers, no internal process docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Generic patterns only: this workflow is a PUBLIC file, so it must not name
      # the very identifiers it guards (usernames, e-mail domains, model ids).
      # The patterns below catch the classes, not the people.
      - name: Fail on home paths or e-mail addresses in tracked files
        run: |
          set -eu
          if git grep -nIE "/home/[A-Za-z0-9._-]+|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" \
               -- . ':!.github/workflows/ci.yml' ; then
            echo "::error::a home path or e-mail address is tracked; keep personal detail in private/"
            exit 1
          fi
      - name: Fail on internal process docs being tracked
        run: |
          set -eu
          if git ls-files | grep -E "^docs/(plans|drafts|archive)/|^docs/(PACKING|COMFY|D1-3B)" ; then
            echo "::error::internal process doc is tracked; it belongs in private/"
            exit 1
          fi
