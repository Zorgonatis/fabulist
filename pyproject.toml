[project]
name = "fabulist"
version = "0.0.2"
description = "Personal RP narrative engine: a MUD with an LLM narrator."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.143.0,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "langgraph>=1.2.14,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "openai>=3.26.1,<4",
    "pydantic>=2,<3",
    "python-multipart>=0.0.32,<1",
    "sqlite-vec>=0.1.9,<1",
    "sse-starlette>=3.5.0,<4",
    "typing-extensions>=4,<5",
    "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.2.1",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabulist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
