# Fabulist sidecar — llama.cpp router preset (issue #18).
#
# ONE llama.cpp service, THREE models, one port. The section name is the model
# id served at /v1/models and the value the engine sends in a request's
# "model" field:
#
#   qwen3-reranker     POST /v1/rerank       (memory recall reranking)
#   embeddinggemma-2   POST /v1/embeddings   (memory index + recall)
#   d1-3b              POST /v1/systemone    (native decision model)
#
# THE WEIGHTS ARE HUGGINGFACE REFERENCES, NOT FILES ON DISK. A section names a
# repo with `hf-repo` and one exact file inside it with `hf-file` — the preset
# form of llama.cpp's --hf-repo / --hf-file flags (probed on the pinned image:
# a preset section carries both keys, and the router renders them into the
# child server's command line). BOOT DOWNLOADS NOTHING: the router starts with
# every model UNLOADED, and the child it spawns on that model's FIRST REQUEST
# fetches the weights then, into the HuggingFace cache. docker-compose.yml sets
# LLAMA_CACHE=/cache and mounts a named volume there, so the ~2.7 GiB is paid
# once and survives recreates. There is no manual download step and no models
# directory to fill.
#
#   qwen3-reranker     Voodisss/Qwen3-Reranker-0.6B-GGUF-llama_cpp
#                      Qwen3-Reranker-0.6B-Q4_K_M.gguf                   378 MiB
#   embeddinggemma-2   unsloth/embeddinggemma-2-GGUF
#                      embeddinggemma-2-Q8_0.gguf                        295 MiB
#                      + mmproj-Q8_0.gguf (same repo, quant-matched)      529 MiB
#   d1-3b              LiquidAI/d1-3B-GGUF
#                      d1-3B-Q4_K_M.gguf                                1.56 GiB
#
# All three repos are ungated and are fetched anonymously. HF_TOKEN is passed
# through by docker-compose.yml because llama.cpp reads it natively; it is not
# needed today and nothing else depends on it.
#
# `hf-file` is DELIBERATE over the ":QUANT" shorthand (hf-repo = repo:Q4_K_M):
# the exact filename pins the artifact, so a repo that later gains quants
# cannot change what this deployment serves. For a reranker the FILE also has
# to be the right CONVERSION (see the reranker section): the GGUF must carry
# qwen3.classifier.output_labels / cls.output.weight, or the server is scoring
# the wrong thing — which no filename would tell you.
#
# MMPROJ IS THE ONE PLACE WHERE AUTO-BEHAVIOUR IS NOT FREE: when hf-repo is
# set, llama.cpp also pulls a sibling "mmproj" GGUF from the same repo, picking
# the quant closest to the model file's. For embeddinggemma-2 that is exactly
# what this server wants (mmproj-Q8_0.gguf for a Q8_0 model — the multimodal
# wiring below). For d1 the repo DOES ship projectors and a Q4_K_M model would
# drag mmproj-d1-3B-Q8_0.gguf (543 MiB) the decision route never uses, so
# d1-3b turns the auto-pick off. The reranker turns it off too: its repo ships
# none today, and the flag keeps a future sibling from appearing silently.
#
# LOCAL WEIGHTS STILL WORK: a deployment that keeps GGUFs on disk (the
# offline override — README > Docker > Models sidecar) replaces a section's
# hf-repo/hf-file pair with `model = /models/...` (+ `mmproj = /models/...`).
# deploy/sidecar/entrypoint.sh checks a local path EXISTS and an HF ref's FORM
# instead, and never treats an hf ref as a missing file.
#
# DEVICE: deliberately ABSENT from every section. A Vulkan device id is
# assigned in Vulkan's enumeration order, not by vendor or model, so pinning
# "Vulkan0" in this file would be a guess that happens to be right on one host
# and wrong on the next. entrypoint.sh resolves the device at boot (explicit
# id, name match, or the single available device), verifies it exists, and
# passes it on the command line. The key looks like this — shown, never shipped
# as a live line:
#
#   device = Vulkan0
#
# There is no separate CPU profile: the Vulkan build falls back to CPU by
# itself when no Vulkan device is present (verified — with the Vulkan ICD
# hidden the same binary served a 10-doc rerank at ~1.1 s, healthy and
# truncated = 0). Removing a GPU does not require a second file.
#
# Every per-model flag below is translated from the maintainer's hand-tuned
# local embedding-router preset (an unshipped six-model service), reduced to
# the three models this sidecar serves. The deltas are named in the comments
# beside them; the reranker's cache flags were re-verified on this Vulkan build
# before shipping (FlashAttention enabled, no "no FlashAttention ... kernel
# compiled" warning, 119 MiB KV at ctx 2048, warm rerank 64-71 ms).
version = 1

# The weights live in llama.cpp's HuggingFace cache now, and the router ALSO
# offers every already-cached model as an entry of its own (`org/repo:QUANT`),
# listed from the second boot on. Those are these same three files, so hide
# them: the served model list is exactly the three ids below — cold cache or
# warm — which is what the engine's auto-pin and the drawer expect.
# (`*` is the router's global preset: it cascades into all three sections and
# never becomes a model of its own.)
[*]
dedup-cache-models = 1

[qwen3-reranker]
# Voodisss/Qwen3-Reranker-0.6B-GGUF-llama_cpp — 378 MiB, ungated. This is the
# repo whose Q4_K_M is BYTE-IDENTICAL (sha256 c04f5f56…, 396476288 bytes) to the
# artifact the owner's hand-tuned deployment had verified live; the DASH in the
# filename is this repo's naming.
#
# Do NOT swap in mradermacher/Qwen3-Reranker-0.6B-GGUF (the obvious popular
# mirror, same nominal quant, DOT-separated name): its conversion DROPS the
# sequence-classification head — no qwen3.classifier.output_labels, no
# qwen3.pooling_type, no cls.output.weight tensor, no rerank chat template —
# so `pooling = rank` scores a generative model's last-token logits. Measured
# on this image: the true-match document scored 0.0 while an unrelated snow
# scene scored 0.98 (the local seq-cls file scores it 1.0). A headless
# conversion is a silently broken reranker, not a smaller one.
hf-repo = Voodisss/Qwen3-Reranker-0.6B-GGUF-llama_cpp
hf-file = Qwen3-Reranker-0.6B-Q4_K_M.gguf
# No projector for a reranker; this repo ships none. Off explicitly so a later
# sibling mmproj cannot turn up in the cache behind our back.
mmproj-auto = false
reranking = true
pooling = rank
embedding = true
gpu-layers = 999
ctx-size = 2048
threads = 8
# Quantized KV cache for the reranker. Measured on the CUDA build: 2158 ->
# 1738 MiB at 8k ctx (-420 MiB, -19.5 %), identical top-2 ordering in every
# probe, no latency cost. At ctx 2048 the KV buffer is 119 MiB on Vulkan
# (f16 would be ~226 MiB), and the Vulkan build compiles the q8_0-q8_0
# FlashAttention kernel (log: "flash_attn = enabled", no
# "no FlashAttention ... kernel compiled" warning; warm rerank 64-71 ms for
# 10 docs). q8_0/q8_0 is deliberate: q5_0 V has no fused FA kernel and falls
# back to a per-op dequantize slow path.
flash-attn = true
cache-type-k = q8_0
cache-type-v = q8_0
# 2048 is sufficient, not a compromise: rerank processes one ~222-token
# (query + document) pair per sequence, with each document clipped to 600
# chars by the engine (recall.py _BULLET_TEXT_LIMIT). A full 25-candidate
# over-fetch ran at ctx 2048 with truncated = 0 on every sequence. The
# sidecar smoke test asserts that invariant, so a future clip-length change
# fails loudly instead of silently truncating documents.
# (owner ruling: flash-attn + q8_0 KV at ctx 2048 for the reranker)

[embeddinggemma-2]
# unsloth/embeddinggemma-2-GGUF — 295 MiB model + 529 MiB projector, ungated.
# SHORT repo name on purpose: it is "embeddinggemma-2-GGUF", not a size-tagged
# variant.
hf-repo = unsloth/embeddinggemma-2-GGUF
hf-file = embeddinggemma-2-Q8_0.gguf
# no `mmproj` key: llama.cpp fills it from the same repo, quant-matched to the
# model file above -> mmproj-Q8_0.gguf (529 MiB). `mmproj-auto` stays on.
ubatch-size = 32768
batch-size = 32768
video-fps = 0.3
embedding = true
pooling = mean
embd-normalize = 2
gpu-layers = 999
ctx-size = 8192
threads = 8
# pooling/normalization are load-bearing, not tuning: changing either changes
# the vectors and forces a full re-embed (ADR: memory index is derived but a
# silent vector change is a data migration). mmproj/video-fps/batch sizes are
# the owner's multimodal wiring; a text embedding call does not touch the
# vision tower, but dropping mmproj would silently change the advertised
# input_modalities.

[d1-3b]
# LiquidAI/d1-3B-GGUF — 1.56 GiB at Q4_K_M, ungated.
hf-repo = LiquidAI/d1-3B-GGUF
hf-file = d1-3B-Q4_K_M.gguf
# The repo ships three projectors (BF16/F16/Q8_0, 543-797 MiB). The decision
# route uses none of them, and a quantified model file would drag the Q8_0 one
# in — so the auto-pick is OFF for d1.
mmproj-auto = false
gpu-layers = 999
ctx-size = 8192
threads = 8
# Native decision model (GGUF `lfm2.decision.type = lfm2-d1`): the server
# advertises output_modalities ["decisions"] and routes /v1/systemone here.
# It answers typed questions in one forward pass and generates no tokens, so
# it carries no sampler keys. ctx only caps the state+questions prompt; the
# engine sends prose states, and 8192 fits them.
